name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pip install ./vendor/monsoon_r1_kit-1.0.0-py3-none-any.whl || pip install "git+https://github.com/OfficialAbhinavSingh/yug-monsoon-kit"
      - run: ruff check .
      - run: pytest -q tests/
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    # The dashboard in a real browser against our own forecast and lab servers. No dataset in CI: the two start-state
    # requests are answered from the committed climatology (e2e/conftest.py); everything else is live.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: dashboard
      - run: pytest -q e2e/
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-failure-screenshots, path: e2e-artifacts/, if-no-files-found: ignore }
