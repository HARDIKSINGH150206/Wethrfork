seed: 17
device: cuda
model:
  hidden: 128
  conv_blocks: 3            # never above 3 (speed limit)
  displacement_cap: 4.0     # cells/day, never above 4.0
  alpha_init: 0.5
  advect_channels: [t2m, tp, u10, v10, msl, tcwv]
optim:
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  batch_size: 32
  amp: bf16
loss:
  channel_weights: {t2m: 1.0, tp: 1.0, u10: 1.0, v10: 1.0, msl: 1.0, tcwv: 1.0}
  heavy_rain_mm: 10.0
  heavy_rain_weight: 3.0
curriculum:
  - {unroll: 1, epochs: 15, input_noise: 0.0}
  - {unroll: 4, epochs: 10, input_noise: 0.05, shock_reg: 0.2, rho_persist: 0.5, rho_far: 0.08}
  - {unroll: 8, epochs: 10, input_noise: 0.05, shock_reg: 0.3, rho_persist: 0.5, rho_far: 0.08}
select:
  metric: selfgrade_mean_ss_calib
  require_gate: true
out_dir: runs/nn_v2
# Checkpoint selection windows (calibration year, never the grading year): last input day per season.
select_windows:
  systematic: {start: "2020-01-03", end: "2020-12-20", every_days: 6}
  shock: {DJF: "2020-01-15", MAM: "2020-04-15", JJAS: "2020-07-15", "ON": "2020-10-15"}
lr_scale_by_stage: [1.0, 0.5, 0.3]
