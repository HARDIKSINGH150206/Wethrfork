# Dynamics network fine-tune: larger, edge-touching shock patches; selected on the official-shock pass rate over many
# calibration-year windows (the per-season gate alone missed weak-wind failures).
seed: 17
device: cuda
model:
  hidden: 128
  conv_blocks: 3            # never above 3 (speed limit)
  displacement_cap: 4.0     # cells/day, never above 4.0
  alpha_init: 0.5
  advect_channels: [t2m, tp, u10, v10, msl, tcwv]
optim:
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  batch_size: 32
  amp: bf16
loss:
  channel_weights: {t2m: 1.0, tp: 1.0, u10: 1.0, v10: 1.0, msl: 1.0, tcwv: 1.0}
  heavy_rain_mm: 10.0
  heavy_rain_weight: 3.0
curriculum:
  - {unroll: 8, epochs: 8, input_noise: 0.05, shock_reg: 0.4, rho_persist: 0.5, rho_far: 0.15, bump_half_max: 8.0, edge_prob: 0.35}
select:
  metric: sweep
  require_gate: true
out_dir: runs/nn_dyn_ft
# Checkpoint selection windows (calibration year, never the grading year): last input day per season.
select_windows:
  systematic: {start: "2020-01-03", end: "2020-12-20", every_days: 6}
  sweep: {start: "2020-01-05", end: "2020-12-20", every_days: 9}
  shock: {DJF: "2020-01-15", MAM: "2020-04-15", JJAS: "2020-07-15", "ON": "2020-10-15"}
lr_scale_by_stage: [0.15]
init_from: runs/nn_v2/best.pt
